<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apphub.casa</title>
<meta name="description" content="Small apps, self-hosted at home.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --card: #1a1d23;
    --card-hover: #22262e;
    --accent: #7aa2f7;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 0.25rem;
    letter-spacing: -0.02em;
  }
  p.tagline {
    color: var(--muted);
    margin: 0 0 2rem;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  li {
    padding: 1rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
  }
  li > a.card-link {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    color: var(--fg);
    text-decoration: none;
  }
  li:hover, li:focus-within {
    background: var(--card-hover);
    border-color: var(--accent);
  }
  .name {
    display: block;
    font-weight: 600;
  }
  .desc {
    display: block;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .lang-links {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }
  .lang-links a {
    font-size: 0.8rem;
    color: var(--accent);
  }
  footer {
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
  footer a {
    color: inherit;
  }
</style>
</head>
<body>
<main>
  <h1>apphub.casa</h1>
  <p class="tagline">Small apps, self-hosted at home.</p>
  <ul>
    <li>
      <a class="card-link" href="https://clock.apphub.casa">
        <span class="name">Clock</span>
        <span class="desc">World clock</span>
      </a>
    </li>
    <li>
      <span class="name">Chores</span>
      <span class="desc">Family allowance &amp; chore tracker</span>
      <div class="lang-links">
        <a href="https://chores.apphub.casa">chores.apphub.casa (English)</a>
        &middot;
        <a href="https://ukepenger.apphub.casa">ukepenger.apphub.casa (Norsk)</a>
      </div>
    </li>
  </ul>
  <footer>
    <a href="https://github.com/gunnaringe/apphub-casa">github.com/gunnaringe/apphub-casa</a>
  </footer>
</main>
</body>
</html>
