<!doctype html>
<!-- The link preview image (shots/og.jpg, 1200x630). capture.mjs renders this
     file from disk after the shots, so it shows the current screenshots. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: 1fr 680px;
    align-items: center;
    gap: 48px;
    padding: 0 56px 0 72px;
    box-sizing: border-box;
    color: #e8ebf2;
    background-color: #0b0d12;
    background-image:
      radial-gradient(900px 420px at 0% 0%, rgb(109 140 255 / .2), transparent 70%),
      radial-gradient(700px 400px at 100% 100%, rgb(53 214 164 / .14), transparent 70%),
      radial-gradient(600px 360px at 0% 100%, rgb(163 230 53 / .1), transparent 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mark {
    width: 72px; height: 72px; border-radius: 18px; background: #6d8cff;
    display: grid; grid-template-columns: repeat(2, 16px); gap: 8px;
    place-content: center; margin-bottom: 32px;
  }
  .mark i { width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  h1 { margin: 0; font-size: 68px; font-weight: 680; letter-spacing: -0.03em; line-height: 1.05; }
  p { margin: 18px 0 0; font-size: 30px; line-height: 1.3; color: #949dad; }
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  img {
    width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block;
    border-radius: 14px; border: 1px solid #2e3646;
    box-shadow: 0 12px 32px -12px rgb(0 0 0 / .7);
  }
</style>
</head>
<body>
  <div>
    <div class="mark"><i></i><i></i><i></i><i></i></div>
    <h1>apphub.casa</h1>
    <p>Small apps for family, church and office</p>
  </div>
  <div class="shots">
    <img src="../shots/sermon-studio.webp" alt="">
    <img src="../shots/chores.webp" alt="">
    <img src="../shots/clock.webp" alt="">
    <img src="../shots/whenever.webp" alt="">
  </div>
</body>
</html>
